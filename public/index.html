    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #333 #000;
        }

        /* Chromium/Safari scrollbar (webkit) */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        body {
            min-height: 100%;
            background: #000;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        /* ── Stars ── */
        .star {
            position: fixed;
            top: 0;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform;
        }

        /* ── Hero section ── */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .title {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 2rem;
            color: #fff;
            position: relative;
            animation: glitch 2s infinite, float 4s ease-in-out infinite;
            will-change: transform, filter;
            text-shadow:
                2px 0 #ff00ff,
                -2px 0 #00ffff,
                0 0 20px rgba(255,255,255,0.8);
        }

        .title::before, .title::after {
            content: 'Gr3asy';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .title.typed::before,
        .title.typed::after { opacity: 1; }
        .title::before { animation: glitch-1 2s infinite, float 4s ease-in-out infinite; color: #ff00ff; z-index: -1; will-change: transform; }
        .title::after  { animation: glitch-2 2s infinite, float 4s ease-in-out infinite reverse; color: #00ffff; z-index: -2; will-change: transform; }

        #cheatNotif {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            color: #00ffcc;
            background: rgba(0,0,0,0.85);
            border: 1px solid #00ffcc55;
            padding: 10px 24px;
            border-radius: 4px;
            letter-spacing: 0.15em;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #cheatNotif.show { opacity: 1; }

        @keyframes float {
            0%,100% { transform: translateY(0) translateX(0); }
            25%      { transform: translateY(-10px) translateX(5px); }
            50%      { transform: translateY(0) translateX(-5px); }
            75%      { transform: translateY(10px) translateX(2px); }
        }

        @keyframes glitch {
            0%,14%,15%,49%,50%,99%,100% { transform:translate(0);filter:hue-rotate(0deg); }
            1%,13%   { transform:translate(-2px,2px);filter:hue-rotate(90deg); }
            16%,48%  { transform:translate(2px,-2px);filter:hue-rotate(180deg); }
            51%,98%  { transform:translate(-1px,1px);filter:hue-rotate(270deg); }
        }

        @keyframes glitch-1 {
            0%,14%,15%,49%,50%,99%,100%{transform:translate(0);}
            1%,13%{transform:translate(-2px,2px);}16%,48%{transform:translate(2px,-2px);}51%,98%{transform:translate(-1px,1px);}
        }
        @keyframes glitch-2 {
            0%,14%,15%,49%,50%,99%,100%{transform:translate(0);}
            1%,13%{transform:translate(2px,-2px);}16%,48%{transform:translate(-2px,2px);}51%,98%{transform:translate(1px,-1px);}
        }

        /* Typing cursor */
        #typingCursor {
            display: inline-block;
            width: 3px;
            height: 0.8em;
            background: #fff;
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        /* ── Buttons ── */
        .btn-row { display:flex; flex-direction:column; align-items:center; gap:14px; }

        .btn {
            display:inline-flex; align-items:center; justify-content:center;
            padding:15px 30px; color:white; text-decoration:none;
            font-size:1.1rem; font-weight:bold; border-radius:50px;
            border:2px solid transparent; transition:transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position:relative;
            -webkit-tap-highlight-color:transparent; touch-action:manipulation;
            cursor:pointer; min-width:240px; gap:10px;
            z-index: 1;
        }
        .btn-shimmer {
            position:absolute; inset:0; border-radius:50px; overflow:hidden; pointer-events:none;
        }
        .btn-shimmer::before {
            content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
            transition:left 0.5s;
        }
        .btn:hover .btn-shimmer::before { left:100%; }
        .btn:hover { transform:translateY(-3px); border-color:rgba(255,255,255,0.3); z-index:2; }
        .btn:focus-visible {
            outline: 2px solid rgba(255,255,255,0.8);
            outline-offset: 3px;
        }

        .btn-youtube { background:linear-gradient(135deg,#e55100,#bf360c); box-shadow:0 5px 20px rgba(191,54,12,0.3); }
        .btn-youtube:hover { box-shadow:0 10px 30px rgba(191,54,12,0.5); }
        .btn-github  { background:linear-gradient(135deg,#333,#111); box-shadow:0 5px 20px rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.15); }
        .btn-github:hover { box-shadow:0 10px 30px rgba(255,255,255,0.15); }
        .btn-discord { background:linear-gradient(135deg,#5865f2,#3d4de0); box-shadow:0 5px 20px rgba(88,101,242,0.3); }
        .btn-discord:hover { box-shadow:0 10px 30px rgba(88,101,242,0.5); }

        .btn-icon { width:1.2em; height:1.2em; flex-shrink:0; fill:white; }

        /* ── Pong section ── */
        .pong-section {
            width: 100%;
            max-width: 700px;
            padding: 0 1rem 4rem;
            z-index: 10;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Launch button */
        .pong-launch-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #00ffcc;
            background: transparent;
            border: 1px solid #00ffcc44;
            border-radius: 4px;
            padding: 10px 28px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }
        .pong-launch-btn::before {
            content: '';
            position: absolute; top:0; left:-100%; width:100%; height:100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,204,0.1), transparent);
            transition: left 0.4s;
        }
        .pong-launch-btn:hover::before { left: 100%; }
        .pong-launch-btn:hover {
            color: #fff;
            border-color: #00ffcc;
            box-shadow: 0 0 12px rgba(0,255,204,0.3);
        }
        .pong-launch-btn:focus-visible {
            outline: 2px solid #00ffcc;
            outline-offset: 3px;
        }

        /* CRT monitor wrapper */
        .crt-monitor {
            display: none;
            width: 100%;
            max-width: 640px;
            background: #0a0a0a;
            border: 2px solid #1a1a1a;
            border-radius: 12px;
            padding: 20px 20px 16px;
            box-shadow:
                0 0 0 1px #111,
                0 0 30px rgba(0,255,204,0.05),
                inset 0 0 40px rgba(0,0,0,0.8);
            position: relative;
            margin-top: 18px;
        }
        .crt-monitor.visible { display: flex; flex-direction: column; align-items: center; gap: 12px; }

        /* Fake monitor bezel top bar */
        .monitor-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: #666;
            letter-spacing: 0.1em;
            padding-bottom: 8px;
            border-bottom: 1px solid #1a1a1a;
        }
        .monitor-dot { width:8px; height:8px; border-radius:50%; background:#222; display:inline-block; margin-right:4px; }
        .monitor-dot.green { background:#00ffcc; box-shadow:0 0 6px #00ffcc; }

        /* Canvas wrapper with CRT effects */
        .canvas-wrap {
            position: relative;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
        }

        #pongCanvas {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
            border-radius: 4px;
            touch-action: none;
        }

        /* CRT scanline overlay */
        .canvas-wrap::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.15) 2px,
                rgba(0,0,0,0.15) 4px
            );
            pointer-events: none;
            border-radius: 4px;
        }

        /* Subtle CRT screen glow vignette */
        .canvas-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
            border-radius: 4px;
        }

        /* Score & controls row */
        .pong-hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.72rem;
            color: #555;
            letter-spacing: 0.08em;
            padding-top: 4px;
        }
        .pong-hud .hint { color: #666; }
        #scoreDisplay { color: #00ffcc; font-size: 0.85rem; }

        /* ── Touch controls ── */
        .touch-controls {
            display: none;
            width: 100%;
            justify-content: center;
            gap: 16px;
            padding-top: 8px;
        }
        @media (hover: none) and (pointer: coarse) {
            .touch-controls { display: flex; }
            .pong-hud .hint { display: none; }
        }
        /* Shared base for all touch control buttons */
        .touch-btn-base {
            font-family: 'Share Tech Mono', monospace;
            color: #00ffcc;
            background: rgba(0,255,204,0.05);
            border: 1px solid rgba(0,255,204,0.25);
            border-radius: 6px;
            height: 52px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .touch-btn {
            font-size: 1.4rem;
            width: 72px;
            touch-action: none;
            transition: background 0.1s, box-shadow 0.1s;
        }
        .touch-btn:active, .touch-btn.pressed {
            background: rgba(0,255,204,0.15);
            box-shadow: 0 0 10px rgba(0,255,204,0.3);
        }
        .touch-start-btn {
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            padding: 0 20px;
            touch-action: manipulation;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
            .btn { padding:12px 24px; font-size:1rem; }
        }
        @media (max-width: 480px) {
            .title { font-size: 2rem; }
            .btn { padding:10px 20px; font-size:0.9rem; }
        }
        @media (max-width: 320px) {
            .title { font-size:1.8rem; }
            .btn { padding:8px 16px; font-size:0.85rem; min-width:180px; }
        }
        @media (min-width:1200px) {
            .title { font-size:4rem; }
            .btn { font-size:1.2rem; padding:18px 36px; }
        }
        @media (min-width:1800px) { .title { font-size:5rem; } }
        @media (hover:none) and (pointer:coarse) { .btn { min-height:48px; padding:16px 32px; } }
        @media (prefers-contrast:high) {
            .title { color:#fff; text-shadow:2px 0 #000,-2px 0 #000; }
            .btn { border:2px solid #fff; }
        }
        @media (prefers-reduced-motion:reduce) {
            .title,
            .title::before,
            .title::after { animation: none; }
            .btn-shimmer { display:none; }
            .btn:hover { transform:none; }
        }
    </style>
</head>

    <script>
        /* ───────── Typing effect ───────── */
        (function() {
            const titleEl    = document.querySelector('.title');
            const word       = 'Gr3asy';
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            // Always type the word — only skip the blinking cursor if reduced motion is on
            titleEl.textContent = '';
            let i = 0;

            const cursor = document.createElement('span');
            cursor.id = 'typingCursor';

            function type() {
                titleEl.textContent = word.slice(0, ++i);
                // Re-appending the same cursor element moves it to end of titleEl
                // (DOM move, not a clone) — this is intentional, not a bug.
                if (!reducedMotion) titleEl.appendChild(cursor);
                if (i < word.length) {
                    setTimeout(type, 120);
                } else {
                    setTimeout(() => {
                        cursor.remove();
                        titleEl.classList.add('typed');
                    }, 500);
                }
            }
            setTimeout(type, 600);
        })();

        /* ───────── Stars ───────── */
        let cachedVW = window.innerWidth || 1024;
        let cachedVH = window.innerHeight || 600;
        window.addEventListener('resize', () => {
            cachedVW = window.innerWidth || 1024;
            cachedVH = window.innerHeight || 600;
        });

        function createStar() {
            if (document.visibilityState === 'hidden') return;
            const star = document.createElement('div');
            const size = Math.random() * 3 + 1;
            star.className = 'star';
            // top:0 is set in CSS; translateY drives position — compositor only, no layout
            star.style.cssText = `left:${Math.random() * cachedVW}px;width:${size}px;height:${size}px;opacity:${(Math.random() * 0.8 + 0.2).toFixed(2)};`;
            document.body.appendChild(star);
            let pos = -5;
            const speed = Math.random() * 3 + 1;
            function move() {
                pos += speed;
                star.style.transform = `translateY(${pos}px)`;
                if (pos < cachedVH + 10) requestAnimationFrame(move);
                else star.remove();
            }
            move();
        }
        let _starInterval = setInterval(createStar, 200);
        document.addEventListener('visibilitychange', () => {
            // Stars already skip creation when hidden; pause the interval
            // itself so it doesn't fire at all on long-hidden tabs.
            if (document.visibilityState === 'hidden') {
                clearInterval(_starInterval);
            } else {
                _starInterval = setInterval(createStar, 200);
                // Restart the pong loop if it was halted by the hidden-tab gate
                if (_pong.resume) _pong.resume();
            }
        });
        for (let i = 0; i < 20; i++) setTimeout(createStar, i * 100);

        /* ───────── Pong state (declared early so easter egg can reference pongOpen) ───────── */
        let pongOpen = false;
        let animId   = null;
        const _pong  = { keys: {}, state: 'idle', startGame: null, player: null, resume: null, padH: 70 };

        // Module-scope mobile detection — shared across initPong cycles so the
        // matchMedia listener always updates the same variable.
        const _mobileQuery = window.matchMedia('(hover: none) and (pointer: coarse)');
        let _isMobile = _mobileQuery.matches;
        _mobileQuery.addEventListener('change', e => { _isMobile = e.matches; });

        /* ───────── PAINKILLER easter egg ───────── */
        (function() {
            const CODE = 'PAINKILLER';
            let buffer = '';
            let eggActive = false;
            let eggTimeout = null;
            let flashInterval = null;

            document.addEventListener('keydown', e => {
                if (e.key.length !== 1 || pongOpen) return;
                buffer = (buffer + e.key.toUpperCase()).slice(-CODE.length);
                if (buffer === CODE) triggerEgg();
            });

            function triggerEgg() {
                if (eggActive) return;
                if (pongOpen) return; // don't wreck the canvas game
                eggActive = true;
                buffer = '';

                // Clear any previous timeout that may still be pending
                if (eggTimeout) { clearTimeout(eggTimeout); eggTimeout = null; }

                // Show notification
                const notif = document.getElementById('cheatNotif');
                notif.classList.add('show');
                setTimeout(() => notif.classList.remove('show'), 3000);

                // Chaos: rapid hue-rotate + shake on body
                const body = document.body;
                let tick = 0;
                const colors = ['#ff00ff','#00ffff','#ffff00','#ff0044','#00ff88'];

                flashInterval = setInterval(() => {
                    if (document.visibilityState === 'hidden') return;
                    tick++;
                    const hue = (tick * 37) % 360;
                    body.style.filter = `hue-rotate(${hue}deg) brightness(${1 + Math.random()}) contrast(${1 + Math.random() * 0.5})`;
                    body.style.transform = `translate(${(Math.random()-0.5)*8}px, ${(Math.random()-0.5)*8}px)`;

                    // spawn glitch bars
                    const bar = document.createElement('div');
                    bar.style.cssText = `
                        position:fixed;
                        left:0; width:100%;
                        height:${Math.random()*6+1}px;
                        top:${Math.random()*100}%;
                        background:${colors[Math.floor(Math.random()*colors.length)]};
                        opacity:${Math.random()*0.6+0.2};
                        pointer-events:none;
                        z-index:9998;
                    `;
                    document.body.appendChild(bar);
                    setTimeout(() => bar.remove(), 80);
                }, 50);

                // Stop after 3 seconds — reset synchronously so styles clear even
                // if the tab was hidden when the timeout fires (rAF won't run then).
                eggTimeout = setTimeout(() => {
                    clearInterval(flashInterval);
                    body.style.filter    = '';
                    body.style.transform = '';
                    eggActive = false;
                }, 3000);
            }
        })();

        /* ───────── Pong ───────── */
        // Offscreen canvas for the static CRT grid — built once, reused every frame
        const _offscreen = document.createElement('canvas');
        _offscreen.width  = 600;
        _offscreen.height = 360;
        (function buildGrid() {
            const C = { bg: '#050e09', dim: '#0a1a10', mid: '#1a4030' };
            const W = 600, H = 360;
            const oc = _offscreen.getContext('2d');
            oc.fillStyle = C.bg;
            oc.fillRect(0, 0, W, H);
            oc.strokeStyle = C.dim;
            oc.lineWidth = 0.5;
            for (let x = 0; x <= W; x += 30) { oc.beginPath(); oc.moveTo(x, 0); oc.lineTo(x, H); oc.stroke(); }
            for (let y = 0; y <= H; y += 30) { oc.beginPath(); oc.moveTo(0, y); oc.lineTo(W, y); oc.stroke(); }
            oc.setLineDash([8, 8]);
            oc.strokeStyle = C.mid;
            oc.lineWidth = 2;
            oc.beginPath(); oc.moveTo(W/2, 0); oc.lineTo(W/2, H); oc.stroke();
            oc.setLineDash([]);
        })();

        // Shared ref object — listeners are registered once but always read
        // the live game state through this, so there's no stale closure issue.

        function togglePong() {
            pongOpen = !pongOpen;
            const monitor = document.getElementById('crtMonitor');
            const btn     = document.getElementById('launchBtn');
            btn.setAttribute('aria-expanded', pongOpen ? 'true' : 'false');
            if (pongOpen) {
                monitor.classList.add('visible');
                btn.textContent = '▼ CLOSE PONG';
                initPong();
            } else {
                monitor.classList.remove('visible');
                btn.textContent = '▶ PLAY PONG';
                if (animId) { cancelAnimationFrame(animId); animId = null; }
            }
        }

        // Listeners registered exactly once at page load — they read _pong live
        (function registerPongListeners() {
            const btnUp    = document.getElementById('btnUp');
            const btnDown  = document.getElementById('btnDown');
            const btnStart = document.getElementById('btnStart');

            document.addEventListener('keydown', e => {
                if (!pongOpen) return;
                _pong.keys[e.key] = true;
                if (e.key === ' ') {
                    e.preventDefault();
                    if ((_pong.state === 'idle' || _pong.state === 'over') && _pong.startGame) _pong.startGame();
                }
            });
            document.addEventListener('keyup', e => {
                if (!pongOpen) return;
                _pong.keys[e.key] = false;
            });

            ['touchstart','mousedown'].forEach(ev => {
                btnUp.addEventListener(ev,   e => { e.preventDefault(); _pong.keys['ArrowUp']   = true;  btnUp.classList.add('pressed'); },   { passive: false });
                btnDown.addEventListener(ev, e => { e.preventDefault(); _pong.keys['ArrowDown'] = true;  btnDown.classList.add('pressed'); }, { passive: false });
            });
            ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => {
                btnUp.addEventListener(ev,   () => { _pong.keys['ArrowUp']   = false; btnUp.classList.remove('pressed'); });
                btnDown.addEventListener(ev, () => { _pong.keys['ArrowDown'] = false; btnDown.classList.remove('pressed'); });
            });
            btnStart.addEventListener('touchstart', e => { e.preventDefault(); if ((_pong.state === 'idle' || _pong.state === 'over') && _pong.startGame) _pong.startGame(); }, { passive: false });
            btnStart.addEventListener('click', () => { if ((_pong.state === 'idle' || _pong.state === 'over') && _pong.startGame) _pong.startGame(); });

            let touchActive = false;
            const canvas = document.getElementById('pongCanvas');
            const H_REF  = 360; // matches canvas height constant
            canvas.addEventListener('touchstart', e => {
                e.preventDefault(); touchActive = true;
                if ((_pong.state === 'idle' || _pong.state === 'over') && _pong.startGame) _pong.startGame();
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                if (!touchActive || _pong.state !== 'playing' || !_pong.player) return;
                const rect   = canvas.getBoundingClientRect();
                const touchY = (e.touches[0].clientY - rect.top) * (H_REF / rect.height);
                const PAD_H  = _pong.padH; // sourced from initPong via _pong to stay in sync
                _pong.player.y = Math.max(0, Math.min(H_REF - PAD_H, touchY - PAD_H / 2));
            }, { passive: false });
            canvas.addEventListener('touchend', () => { touchActive = false; });
        })();

        function initPong() {
            const canvas = document.getElementById('pongCanvas');
            const keys   = _pong.keys;
            const ctx    = canvas.getContext('2d');
            ctx.textAlign = 'center';

            const W = 600, H = 360;
            const PAD_W = 10, PAD_H = 70, PAD_SPEED = 5;
            const BALL_SIZE = 8;
            const WIN_SCORE = 7;
            _pong.padH = PAD_H; // keep touch listener in sync with game constant

            // Always start fresh — prevents stale state if pong was closed mid-game
            let state = 'idle';
            function setState(s) { state = s; _pong.state = s; }
            setState('idle');

            const C = {
                bg:    '#050e09',
                dim:   '#0a1a10',
                glow:  '#00ffcc',
                white: '#ccffe8',
                mid:   '#1a4030',
                text:  '#00ffcc',
                score: '#00ffcc',
            };

            // Use module-scope _isMobile (updated by a single matchMedia listener)
            // so the value stays correct across open/close cycles.
            const isMobile = _isMobile;

            // Update monitor bar hint to match control scheme
            document.getElementById('monitorControls').textContent = isMobile ? 'DRAG TO MOVE' : 'W/S TO MOVE';

            let playerScore = 0, aiScore = 0;

            let player = { x: 20, y: H/2 - PAD_H/2, w: PAD_W, h: PAD_H };
            let ai     = { x: W - 20 - PAD_W, y: H/2 - PAD_H/2, w: PAD_W, h: PAD_H };

            // Keep shared ref up to date so listeners always see current values
            _pong.player = player;

            const MAX_VX = PAD_W - BALL_SIZE / 2; // ball can't skip past a paddle in one frame

            function resetBall(dir = 1) {
                const angle = (Math.random() * 60 - 30) * Math.PI / 180;
                const speed = 3.0;
                return { x: W/2, y: H/2, vx: Math.cos(angle) * speed * dir, vy: Math.sin(angle) * speed, trail: [] };
            }

            let ball = resetBall();

            function startGame() {
                playerScore = 0; aiScore = 0;
                player.y = H/2 - PAD_H/2;
                ai.y     = H/2 - PAD_H/2;
                ball  = resetBall(Math.random() > 0.5 ? 1 : -1);
                setState('playing');
                newAiError();
                updateHUD();
            }

            // Assigned after declaration so there's no hoisting ambiguity
            _pong.startGame = startGame;

            // Cache HUD refs once — updateHUD is called on every score event
            const _hudScore  = document.getElementById('scoreDisplay');
            const _hudHint   = document.getElementById('gameHint');
            const _hudStatus = document.getElementById('monitorStatus');

            function updateHUD() {
                _hudScore.textContent = `YOU: ${playerScore}  |  AI: ${aiScore}`;
                if (state === 'idle')         { _hudHint.textContent = 'Press SPACE to start'; _hudStatus.textContent = 'READY'; }
                else if (state === 'playing') { _hudHint.textContent = 'W / S to move';        _hudStatus.textContent = 'LIVE'; }
                else if (state === 'over')    { _hudHint.textContent = 'Press SPACE to restart'; _hudStatus.textContent = 'GAME OVER'; }
            }

            function drawGlowRect(x, y, w, h, color, blur=8) {
                ctx.save();
                ctx.shadowColor = color;
                ctx.shadowBlur  = blur;
                ctx.fillStyle   = color;
                ctx.fillRect(x, y, w, h);
                ctx.restore();
            }

            function drawBall(b) {
                // Trail — save/restore once outside the loop instead of per-dot
                ctx.save();
                ctx.shadowColor = C.glow;
                ctx.fillStyle   = C.glow;
                for (let i = 0; i < b.trail.length; i++) {
                    const t = b.trail[i];
                    ctx.globalAlpha = (i / b.trail.length) * 0.4;
                    ctx.shadowBlur  = 6;
                    const s = BALL_SIZE * (i / b.trail.length);
                    ctx.fillRect(t.x - s/2, t.y - s/2, s, s);
                }
                ctx.restore();
                drawGlowRect(b.x - BALL_SIZE/2, b.y - BALL_SIZE/2, BALL_SIZE, BALL_SIZE, C.glow, 14);
            }

            // Paddle collision helper — pure: takes ball explicitly
            function hitPad(b, pad) {
                return b.x - BALL_SIZE/2 < pad.x + pad.w &&
                       b.x + BALL_SIZE/2 > pad.x &&
                       b.y > pad.y && b.y < pad.y + pad.h;
            }

            let aiTarget   = H / 2;
            let aiError    = 0; // picked once per rally, not per frame
            const AI_SPEED = 2.8;

            function newAiError() { aiError = (Math.random() - 0.5) * 20; }

            function update() {
                if (state !== 'playing') return;

                // Player movement
                if ((keys['w'] || keys['W'] || keys['ArrowUp'])    && player.y > 2)          player.y -= PAD_SPEED;
                if ((keys['s'] || keys['S'] || keys['ArrowDown'])  && player.y < H - PAD_H - 2) player.y += PAD_SPEED;

                // AI tracking — error offset is stable per rally, not re-rolled every frame
                if (ball.vx > 0) {
                    aiTarget = ball.y - PAD_H / 2 + aiError;
                } else {
                    aiTarget = H/2 - PAD_H/2;
                }
                const aiCenter = ai.y + PAD_H/2;
                const targetCenter = aiTarget + PAD_H/2;
                if (aiCenter < targetCenter - 2) ai.y = Math.min(ai.y + AI_SPEED, H - PAD_H);
                if (aiCenter > targetCenter + 2) ai.y = Math.max(ai.y - AI_SPEED, 0);

                // Ball trail
                ball.trail.push({ x: ball.x, y: ball.y });
                if (ball.trail.length > 8) ball.trail.shift();

                // Ball movement
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Top/bottom bounce
                if (ball.y - BALL_SIZE/2 <= 0) { ball.y = BALL_SIZE/2; ball.vy *= -1; }
                if (ball.y + BALL_SIZE/2 >= H)  { ball.y = H - BALL_SIZE/2; ball.vy *= -1; }

                if (hitPad(ball, player)) {
                    ball.x = player.x + player.w + BALL_SIZE/2;
                    const rel = (ball.y - (player.y + PAD_H/2)) / (PAD_H/2);
                    const angle = rel * 60 * Math.PI / 180;
                    const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.1, 8);
                    ball.vx = Math.min( Math.cos(angle) * speed, MAX_VX);
                    ball.vy =  Math.sin(angle) * speed;
                }
                if (hitPad(ball, ai)) {
                    ball.x = ai.x - BALL_SIZE/2;
                    const rel = (ball.y - (ai.y + PAD_H/2)) / (PAD_H/2);
                    const angle = rel * 60 * Math.PI / 180;
                    const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.1, 8);
                    ball.vx = -Math.min(Math.cos(angle) * speed, MAX_VX);
                    ball.vy =  Math.sin(angle) * speed;
                }

                // Scoring
                if (ball.x < 0) {
                    aiScore++;
                    updateHUD();
                    if (aiScore >= WIN_SCORE) { setState('over'); updateHUD(); return; }
                    ball = resetBall(1);  newAiError();
                    player.y = H/2 - PAD_H/2; ai.y = H/2 - PAD_H/2;
                } else if (ball.x > W) {
                    playerScore++;
                    updateHUD();
                    if (playerScore >= WIN_SCORE) { setState('over'); updateHUD(); return; }
                    ball = resetBall(-1); newAiError();
                    player.y = H/2 - PAD_H/2; ai.y = H/2 - PAD_H/2;
                }
            }

            function drawCRTBackground() {
                ctx.drawImage(_offscreen, 0, 0);
            }

            function drawText(text, x, y, size=16, color=C.text, blur=8) {
                ctx.save();
                ctx.font = `${size}px 'Share Tech Mono', monospace`;
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = blur;
                // textAlign is 'center' — set once at context init, never changed
                ctx.fillText(text, x, y);
                ctx.restore();
            }

            function draw() {
                if (state === 'idle') {
                    // Skip CRT grid — overlay covers it entirely
                    ctx.fillStyle = 'rgba(0,0,0,0.55)';
                    ctx.fillRect(0, 0, W, H);
                    drawText('GR3ASY PONG', W/2, H/2 - 30, 28, C.glow, 20);
                    drawText(isMobile ? 'TAP TO START' : 'PRESS SPACE TO START', W/2, H/2 + 10, 14, C.text, 8);
                    drawText(isMobile ? 'DRAG PADDLE OR USE BUTTONS' : 'W / S  TO  MOVE', W/2, H/2 + 36, 11, '#557060', 0);
                    return;
                }

                drawCRTBackground();

                // Scores
                drawText(playerScore, W/4,   50, 40, C.score, 16);
                drawText(aiScore,     W*3/4, 50, 40, C.score, 16);

                // Paddles
                drawGlowRect(player.x, player.y, player.w, player.h, C.white, 10);
                drawGlowRect(ai.x,     ai.y,     ai.w,     ai.h,     C.white, 10);

                // Ball
                drawBall(ball);

                if (state === 'over') {
                    ctx.fillStyle = 'rgba(0,0,0,0.65)';
                    ctx.fillRect(0, 0, W, H);
                    const won = playerScore >= WIN_SCORE;
                    drawText(won ? 'YOU WIN' : 'GAME OVER', W/2, H/2 - 28, 32, won ? C.glow : '#ff4466', 22);
                    drawText(`${playerScore} — ${aiScore}`, W/2, H/2 + 12, 22, C.text, 10);
                    drawText(isMobile ? 'TAP START TO PLAY AGAIN' : 'PRESS SPACE TO PLAY AGAIN', W/2, H/2 + 44, 12, '#557060', 0);
                }
            }

            function loop() {
                if (!pongOpen) return;
                animId = null; // clear before rescheduling so stale-cancel checks are reliable
                if (document.visibilityState !== 'hidden') {
                    update();
                    draw();
                    animId = requestAnimationFrame(loop);
                }
                // When hidden, rAF is not rescheduled; _pong.resume restarts it on tab restore
            }

            // Expose resume so the visibilitychange handler can restart the loop
            _pong.resume = function() {
                if (pongOpen && !animId) {
                    animId = requestAnimationFrame(loop);
                }
            };

            if (animId) cancelAnimationFrame(animId);
            updateHUD(); // populate HUD immediately so scoreDisplay isn't blank
            loop();
        }
    </script>
</body>
</html>
